# Kafka for the ANPR pipeline: the buffer between NiFi and Flink.
#
# One broker, KRaft mode - no Zookeeper. A single node is deliberate: this is a
# demonstrable pipeline, not a production cluster, and every replication factor below
# is 1 for the same reason.
#
#   docker compose up -d       start
#   docker compose down -v     stop and delete the data
#
services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: anpr-kafka
    ports:
      # Only the external listener is published. Containers reach the broker over the
      # compose network instead, on 19092.
      - "9092:9092"
    environment:
      # KRaft: this node is both the broker and the controller quorum.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      #   INTERNAL  kafka:19092      for NiFi and anything else inside compose
      #   EXTERNAL  localhost:9092   for the Flink job, which runs in your IDE on the host
      #
      # One listener cannot serve both. Advertising only kafka:19092 makes the host client
      # connect, then hang trying to resolve "kafka"; advertising only localhost:9092
      # sends containers to themselves.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single node, so nothing can be replicated anywhere.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # No waiting for other consumers to show up before the first rebalance.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Off on purpose: a typo in a topic name should fail loudly, not silently create a
      # second topic that nothing ever writes to. The topics are created below instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics once the broker is accepting connections, then exits. Declaring
  # them here documents the topology - the two topics ARE the contract between the three
  # systems, so they should not appear by accident on first publish.
  kafka-topics:
    image: apache/kafka:3.9.0
    container_name: anpr-kafka-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic anpr-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
        echo '--- topics ---'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # Ingest & enrich: validates detections, resolves camera -> location and plate ->
  # watchlist, then publishes enriched events to anpr-events and SINGLE_MATCH to alerts.
  nifi:
    image: apache/nifi:2.12.0
    container_name: anpr-nifi
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # HTTPS only - NiFi 2.0 dropped plain HTTP, so NIFI_WEB_HTTP_PORT no longer exists.
      # https://localhost:8443/nifi, past a self-signed certificate warning.
      - "8443:8443"
    environment:
      # A demo credential, deliberately in the repo. NiFi silently generates a random
      # password instead if this is under 12 characters, which locks you out of your own
      # container.
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: anpr-demo-password

      # Default is 1g claimed at boot. Lower start, same ceiling.
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      # Named volumes, NOT bind mounts: a bind mount of an empty host directory would
      # hide the image's nifi.properties and the container would not start. Docker seeds
      # a named volume from the image instead.
      - nifi-conf:/opt/nifi/nifi-current/conf                 # flow.json.gz - the canvas
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-database:/opt/nifi/nifi-current/database_repository

      # Read-only: the lookup services read these repeatedly and must never consume them.
      - ./sample-data:/opt/nifi/sample-data:ro

      # GetFile DELETES what it picks up, so it gets its own directory. Run the demo with
      #   cp sample-data/detections.csv ingest/
      - ./ingest:/opt/nifi/ingest

      # PutFile writes alerts and the event archive here; read them on the host.
      - ./data-out:/opt/nifi/data-out

# Survive `docker compose down`, so the flow outlives a restart. Only `down -v` clears
# them - and Kafka, having no volumes, resets either way.
volumes:
  nifi-conf:
  nifi-state:
  nifi-database:
